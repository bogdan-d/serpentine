---
name: Build Serpentine
on:
  schedule:
    - cron: '05 05 */2 * *'  # 05:05am UTC every 2 days
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.vscode/**'
      - 'AGENTS.md'
      - 'AGENTS*.md'
      - '**/LICENSE'
      - '**/README.md'
      - '**/SETUP.md'
  push:
    branches:
      - main
    paths-ignore:
      - '.vscode/**'
      - 'AGENTS.md'
      - 'AGENTS*.md'
      - '**/LICENSE'
      - '**/README.md'
      - '**/SETUP.md'
  merge_group:
  workflow_dispatch:

permissions: {}

env:
  IMAGE_DESC: "${{ github.event.repository.description }}"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,bazzite,serpentine"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/4302588?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # The tag used in the image from which we base of.
  # ex.: ghcr.io/org/image:IMAGE_SOURCE_TAG
  IMAGE_SOURCE_TAG: "latest"
  SOURCE_ORG: "ublue-os"
  SOURCE_REPO: "bazzite"
  DEFAULT_TAG: "latest"
  REPO_OWNER: "${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        base_image:
          - bazzite
          # - bazzite-nvidia
          # - bazzite-deck
          # - bazzite-deck-gnome
          # - bazzite-deck-nvidia-gnome
          # - bazzite-deck-nvidia

    env:
      BASE_IMAGE: ${{ matrix.base_image }}

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Check Just syntax
        run: |
          if ! command -v just >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y just
          fi

          just check

      # QUICK CLEANUP: reclaim common caches and large SDKs before heavy pulls
      - name: Quick runner cleanup & report
        run: |
          echo "Disk: before cleanup"
          df -h /
          echo "Containers storage (if present):"
          sudo du -sh /var/lib/containers || true

          # Remove known large SDKs/tooling that GH runners often have
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true

          # Clean package manager caches
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get -y autoremove || true
            sudo apt-get -y clean || true
            sudo rm -rf /var/cache/apt/archives/* || true
          fi
          if command -v dnf >/dev/null 2>&1; then
            sudo dnf -y clean all || true
            sudo rm -rf /var/cache/dnf/* || true
          fi

          # Prune Docker if present (best-effort)
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af || true
          fi

          # Small temp cleanup
          sudo rm -rf /tmp/* /var/tmp/* || true

          echo "Disk: after cleanup"
          df -h /
          sudo du -sh /var/lib/containers || true

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Show disk space
        run: sudo df -h

      - name: Check if /mnt is there
        id: check_mnt
        run: |
          if sudo mountpoint /mnt; then
            echo "mnt_is_there=1" >>$GITHUB_OUTPUT
          else
            echo "mnt_is_there=0" >>$GITHUB_OUTPUT
          fi

      - name: Free Disk Space (Ubuntu)
        if: ${{ steps.check_mnt.outputs.mnt_is_there == '1' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@main
        if: ${{ steps.check_mnt.outputs.mnt_is_there == '1' }}
        id: container-storage-action
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Get lower-case repo owner
        id: repo_owner_case
        run: echo "lowercase=${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Define image variables
        id: image_vars
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
        run: |
          IMAGE_NAME="${BASE_IMAGE/bazzite/serpentine}"
          IMAGE_NAME="${IMAGE_NAME/-deck/}"
          IMAGE_NAME="${IMAGE_NAME,,}"

          SOURCE_IMAGE="ghcr.io/${SOURCE_ORG}/${BASE_IMAGE}:${IMAGE_SOURCE_TAG}"
          OUTPUT_IMAGE="ghcr.io/${{ steps.repo_owner_case.outputs.lowercase }}/${IMAGE_NAME}"

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "source_image=${SOURCE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "output_image=${OUTPUT_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "prev_ref=${OUTPUT_IMAGE}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      ## BEGIN:FROM BAZZITE-DX
      # OUTPUTS:
      #   - SOURCE_VERSION: version of the source image. Ex.: testing-41.20250312
      #   - SOURCE_VERSION_MAJOR: major version. Used to identify big releases. Ex.: 41
      - name: Get image major version
        id: fetch_source_meta
        env:
          SOURCE_IMAGE: ${{ steps.image_vars.outputs.source_image }}
        run: |
          set -euo pipefail

          sudo podman pull "${SOURCE_IMAGE}"

          # SOURCE_VERSION_MAJOR must be a number
          declare -i SOURCE_VERSION_MAJOR=0

          # There are some ways to get the major release from an image.
          # First method: `skopeo inspect` and annotations.

          SOURCE_VERSION=$(
                skopeo inspect --no-tags --raw --config \
                "docker://${SOURCE_IMAGE}" | \
                jq -r '.config.Labels["org.opencontainers.image.version"]'
          )
          if [[ -z "$SOURCE_VERSION" || "$SOURCE_VERSION" == "null" ]]; then
            echo "::error::SOURCE_VERSION was not fetched correctly: ${SOURCE_VERSION}"
            exit 1
          fi
          echo "SOURCE_VERSION=$SOURCE_VERSION" >>$GITHUB_OUTPUT

          SOURCE_VERSION_MAJOR=$([[ ${SOURCE_VERSION} =~ ^(.*-)?([[:digit:]]+) ]] && echo "${BASH_REMATCH[-1]}")
          _status=$?
          unset -v _tag

          if [[ $_status -ne 0 ]] || [[ -z ${SOURCE_VERSION_MAJOR} ]] || (( SOURCE_VERSION_MAJOR <= 0 )); then
            echo "::error::SOURCE_VERSION_MAJOR was not fetched correctly: SOURCE_VERSION_MAJOR=${SOURCE_VERSION_MAJOR}"
            exit 1
          fi

          echo "SOURCE_VERSION_MAJOR=$SOURCE_VERSION_MAJOR" >>$GITHUB_OUTPUT

      ## END:FROM BAZZITE-DX

      - name: Compute version tags
        id: version
        env:
          MAJOR: ${{ steps.fetch_source_meta.outputs.SOURCE_VERSION_MAJOR }}
          OUTPUT_IMAGE: ${{ steps.image_vars.outputs.output_image }}
          SOURCE_VERSION: ${{ steps.fetch_source_meta.outputs.SOURCE_VERSION }}
        run: |
          set -euo pipefail

          TODAY=$(date -u +%Y%m%d)
          BASE_TAG="${MAJOR}.${TODAY}"

          # Try to list existing tags; if the image doesn't exist yet, default to first build
          EXISTING_TAGS=$(skopeo list-tags "docker://${OUTPUT_IMAGE}" 2>/dev/null | jq -r '.Tags[]' 2>/dev/null || echo "")

          # Find highest counter for today's date pattern
          COUNTER=0
          for tag in $EXISTING_TAGS; do
            if [[ "$tag" == "${BASE_TAG}" ]] && (( COUNTER < 1 )); then
              COUNTER=1
            elif [[ "$tag" =~ ^${BASE_TAG}\.([0-9]+)$ ]]; then
              N="${BASH_REMATCH[1]}"
              if (( N + 1 > COUNTER )); then
                COUNTER=$((N + 1))
              fi
            fi
          done

          if (( COUNTER == 0 )); then
            VERSION_TAG="${BASE_TAG}"
          else
            VERSION_TAG="${BASE_TAG}.${COUNTER}"
          fi

          {
            echo "version_tag=${VERSION_TAG}"
            echo "pretty_version=Stable (${SOURCE_VERSION})"
            echo "alias_tags<<EOF"
            printf '%s\n' \
              latest \
              stable \
              "stable-${MAJOR}" \
              "stable-${VERSION_TAG}" \
              "${MAJOR}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Primary version tag: ${VERSION_TAG}"

      - name: Build image labels
        id: labels
        env:
          IMAGE_NAME: ${{ steps.image_vars.outputs.image_name }}
          SOURCE_IMAGE: ${{ steps.image_vars.outputs.source_image }}
        run: |
          {
            echo "labels<<EOF"
            printf '%s\n' \
              "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md" \
              "org.opencontainers.image.created=${{ steps.date.outputs.date }}" \
              "org.opencontainers.image.description=${{ env.IMAGE_DESC }}" \
              "org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md" \
              "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              "org.opencontainers.image.title=${IMAGE_NAME}" \
              "org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}" \
              "org.opencontainers.image.vendor=${{ github.repository_owner }}" \
              "org.opencontainers.image.version=${{ steps.version.outputs.version_tag }}" \
              "org.opencontainers.image.revision=${{ github.sha }}" \
              "org.opencontainers.image.base.name=${SOURCE_IMAGE}" \
              "org.opencontainers.image.base.version=${{ steps.fetch_source_meta.outputs.SOURCE_VERSION }}" \
              "io.artifacthub.package.deprecated=false" \
              "io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}" \
              "io.artifacthub.package.license=Apache-2.0" \
              "io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}" \
              "io.artifacthub.package.prerelease=false" \
              "containers.bootc=1"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build_image
        env:
          IMAGE_NAME: ${{ steps.image_vars.outputs.image_name }}
          SOURCE_IMAGE: ${{ steps.image_vars.outputs.source_image }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail

          # Construct label arguments (labels are newline-separated key=value pairs)
          LABEL_ARGS=()
          while IFS= read -r label; do
            [[ -n "${label}" ]] && LABEL_ARGS+=(--label "${label}")
          done <<< "${LABELS}"

          sudo podman build \
            --pull=always \
            --file ./Containerfile \
            --format docker \
            --build-arg "BASE_IMAGE=${SOURCE_IMAGE}" \
            --build-arg "IMAGE_NAME=${IMAGE_NAME}" \
            --build-arg "IMAGE_VENDOR=${{ steps.repo_owner_case.outputs.lowercase }}" \
            --tag "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            "${LABEL_ARGS[@]}" \
            .

      - name: Setup Syft
        id: setup-syft
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.39.0

      - name: Generate SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: generate-sbom
        env:
          IMAGE: ${{ steps.image_vars.outputs.image_name }}
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
          OCI_DIR: "/tmp/image-oci-dir"
        run: |
          mkdir -p ${OCI_DIR}/rootfs
          sudo podman container create --replace --name "${IMAGE}" "localhost/${IMAGE}:${DEFAULT_TAG}"
          sudo podman export "${IMAGE}" | sudo tar -C ${OCI_DIR}/rootfs -xf -
          sudo podman container rm "${IMAGE}"

          SBOM="$(mktemp -d)/sbom.json"
          export SYFT_PARALLELISM=$(($(nproc)*2))
          sudo ${SYFT_CMD} --source-name "${IMAGE}" ${OCI_DIR} -o syft-json=${SBOM}
          du -sh ${SBOM}
          echo "SBOM=${SBOM}" >> $GITHUB_OUTPUT
          sudo rm -rf ${OCI_DIR}

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      - name: Run Rechunker
        id: rechunk
        uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
        with:
          rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
          ref: "localhost/${{ steps.image_vars.outputs.image_name }}:${{ env.DEFAULT_TAG }}"
          prev-ref: "${{ steps.image_vars.outputs.prev_ref }}"
          skip_compression: true
          version: ${{ steps.version.outputs.version_tag }}
          labels: ${{ steps.labels.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      - name: Clean rechunker temp data
        if: always()
        run: |
          sudo rm -rf ${{ steps.rechunk.outputs.location }}

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          OUTPUT_IMAGE: ${{ steps.image_vars.outputs.output_image }}
          RECHUNK_REF: ${{ steps.rechunk.outputs.ref }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          ALIAS_TAGS: ${{ steps.version.outputs.alias_tags }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 15
          command: |
            set -euo pipefail

            log_sum() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
            log_sum '# Push to GHCR result'
            log_sum '```'

            primary_image="${OUTPUT_IMAGE}:${VERSION_TAG}"
            sudo skopeo copy "${RECHUNK_REF}" "docker://${primary_image}"
            log_sum "${primary_image}"

            for tag in ${ALIAS_TAGS}; do
              dest_image="${OUTPUT_IMAGE}:${tag}"
              sudo skopeo copy "${RECHUNK_REF}" "docker://${dest_image}"
              log_sum "${dest_image}"
            done

            log_sum '```'

            digest=$(sudo skopeo inspect --format '{{.Digest}}' "docker://${primary_image}")
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          OUTPUT_IMAGE: ${{ steps.image_vars.outputs.output_image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false ${OUTPUT_IMAGE}@${DIGEST}

      - name: Install ORAS
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Login to GitHub Container Registry with ORAS
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Upload SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: upload-sbom
        env:
          IMAGE: ${{ steps.image_vars.outputs.output_image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ steps.generate-sbom.outputs.SBOM }}
        run: |
          cd "$(dirname "${SBOM}")"
          oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation filename=$(basename "$SBOM") \
            "${IMAGE}@${DIGEST}" \
            "$(basename ${SBOM})"

          sbom_digest=$(oras discover --format json "${IMAGE}@${DIGEST}" | jq -r '.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest')
          echo "sbom_digest=${sbom_digest}" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ steps.image_vars.outputs.output_image }}
          SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom_digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false ${IMAGE}@${SBOM_DIGEST}

      - name: Attestation
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.image_vars.outputs.output_image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  check:
    name: Check all builds successful
    if: always()
    runs-on: ubuntu-latest
    needs: [build_push]
    steps:
      - name: Check Jobs
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "Job status:"
          echo $JOBS | jq -r 'to_entries[] | " - \(.key): \(.value.result)"'

          for i in $(echo $JOBS | jq -r 'to_entries[] | .value.result'); do
            if [ "$i" != "success" ] && [ "$i" != "skipped" ]; then
              echo ""
              echo "Status check not okay!"
              exit 1
            fi
          done

  generate_release:
    name: Generate Release
    needs: [build_push]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/generate_release.yml
